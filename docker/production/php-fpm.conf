[global]
daemonize = no
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid

[www]
listen = 9000
user = www-data
group = www-data
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 90s
